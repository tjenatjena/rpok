<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rpok</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <nav id="positions" class="positions" aria-label="Position">
      <button id="drill-toggle" class="drill-toggle" type="button">Drill</button>
    </nav>

    <section class="table-wrap">
      <div id="table" class="table">
        <div class="rail"><div class="felt"></div></div>
        <div id="pot" class="pot"></div>
        <div id="dealer" class="dealer">D</div>
      </div>

      <aside class="profiles">
        <h3>Profil</h3>
        <ul id="profile-list" class="profile-list"></ul>
      </aside>
    </section>

    <section class="range">
      <div id="grid" class="grid"></div>

      <aside class="panel">
        <h2 id="spot-title"></h2>
        <p id="spot-sub" class="muted"></p>
        <p id="parse-errors" class="parse-errors" hidden></p>
        <div id="sizing-note" class="sizing-note" hidden></div>

        <ul id="legend" class="legend"></ul>

        <div id="hover" class="hover"></div>

        <div id="drill-panel" class="drill-panel" hidden>
          <div class="drill-cards">
            <div id="drill-card-1" class="drill-card"></div>
            <div id="drill-card-2" class="drill-card"></div>
          </div>
          <div id="drill-feedback" class="drill-feedback"></div>
          <div class="drill-actions">
            <button id="drill-fold" class="drill-btn fold" type="button">FOLD</button>
            <button id="drill-raise" class="drill-btn raise" type="button">RAISE</button>
          </div>
          <div id="drill-score" class="drill-score"></div>
        </div>
      </aside>
    </section>
  </main>

  <script src="js/ranges.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
