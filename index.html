<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rpok</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <nav id="positions" class="positions" aria-label="Position">
      <button id="drill-toggle" class="drill-toggle" type="button">Drill</button>
      <div id="drill-menu" class="drill-menu" hidden></div>
      <div id="format-switch" class="format-switch" role="group" aria-label="Format de table">
        <button type="button" data-format="9max">9max</button>
        <button type="button" data-format="6max">6max</button>
      </div>
    </nav>

    <section class="table-wrap">
      <div class="profiles profiles-ghost" aria-hidden="true"></div>

      <div id="table" class="table">
        <div class="rail"><div class="felt"></div></div>
        <div id="pot" class="pot"></div>
        <div id="dealer" class="dealer">D</div>
      </div>

      <aside class="profiles">
        <h3>Profil</h3>
        <ul id="profile-list" class="profile-list"></ul>
      </aside>
    </section>

    <section class="range">
      <div id="grid" class="grid"></div>

      <aside class="panel">
        <div class="panel-head">
          <h2 id="spot-title"></h2>
          <span id="drill-score" class="drill-score"></span>
        </div>
        <p id="spot-sub" class="muted"></p>
        <p id="parse-errors" class="parse-errors" hidden></p>
        <div id="sizing-note" class="sizing-note" hidden></div>

        <ul id="legend" class="legend"></ul>

        <div id="hover" class="hover"></div>

        <div id="drill-panel" class="drill-panel" hidden>
          <div class="drill-cards">
            <div id="drill-card-1" class="drill-card"></div>
            <div id="drill-card-2" class="drill-card"></div>
          </div>
          <div id="drill-feedback" class="drill-feedback"></div>
          <div id="drill-actions" class="drill-actions"></div>
          <div class="drill-nav">
            <button id="drill-range" class="drill-range" type="button">Voir la range</button>
            <button id="drill-next" class="drill-next" type="button" hidden>Suivant</button>
          </div>
        </div>
      </aside>
    </section>
  </main>

  <div id="errors-modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="errors-title">
      <header class="modal-head">
        <h2 id="errors-title">Erreurs du drill</h2>
        <button id="errors-close" class="modal-close" type="button" aria-label="Fermer">×</button>
      </header>
      <div class="errors-filters">
        <div id="errors-modes" class="errors-modes"></div>
        <select id="errors-profile" aria-label="Profil"></select>
      </div>
      <div id="errors-body" class="errors-body"></div>
      <footer class="modal-foot">
        <button id="errors-reset" type="button">Réinitialiser</button>
      </footer>
    </div>
  </div>

  <div id="results-modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="results-title">
      <header class="modal-head">
        <h2 id="results-title">Résultat du drill</h2>
        <button id="results-close" class="modal-close" type="button" aria-label="Fermer">×</button>
      </header>
      <div id="results-body" class="errors-body"></div>
      <footer class="modal-foot">
        <button id="results-again" type="button">Rejouer 100 mains</button>
      </footer>
    </div>
  </div>

  <script src="js/ranges.js"></script>
  <script src="js/app.js"></script>
  <script src="js/drill.js"></script>
</body>
</html>
