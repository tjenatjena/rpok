<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rpok</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <nav id="positions" class="positions" aria-label="Position"></nav>

    <section class="table-wrap">
      <div id="table" class="table">
        <div class="rail"><div class="felt"></div></div>
        <div id="pot" class="pot"></div>
        <div id="dealer" class="dealer">D</div>
      </div>

      <aside class="deviation">
        <h3>Indice</h3>
        <ul id="dev-list" class="dev-list"></ul>
      </aside>
    </section>

    <section class="range">
      <div id="grid" class="grid"></div>

      <aside class="panel">
        <h2 id="spot-title"></h2>
        <p id="spot-sub" class="muted"></p>
        <p id="parse-errors" class="parse-errors" hidden></p>

        <div class="stats">
          <div><span class="muted">Mains jouées</span><strong id="stat-pct"></strong></div>
          <div><span class="muted">Combos / 1326</span><strong id="stat-combos"></strong></div>
        </div>

        <ul id="legend" class="legend"></ul>

        <div id="hover" class="hover"></div>

        <p class="hint muted">Astuce : ← → change de position, ↑ ↓ change l'indice de déviation.</p>
      </aside>
    </section>
  </main>

  <script src="js/ranges.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
